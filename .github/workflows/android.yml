name: android
# The phone app in android/. Runs only when it (or this file) changes, so server PRs stay fast.
on:
  pull_request:
    paths: ["android/**", "design/**", ".github/workflows/android.yml"]
  push:
    branches: [main, develop]
    paths: ["android/**", "design/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: design tokens are generated and screens use them
        run: node ../design/build.mjs --check && node ../design/lint-android.mjs
      # recordRoborazziDebug runs the unit tests and saves the screenshots (cover and unfolded, light and dark).
      - run: ./gradlew --no-daemon lint recordRoborazziDebug assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi/*.png
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memexhub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      # Pushes to develop/main also build the APK signed with the app key, so it installs over the
      # previous version. Needs the repository secrets ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD (android/README.md → Release builds); skipped in forks and PRs.
      - name: version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: signed release APK
        if: github.event_name == 'push' && env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=memexhub \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          rm -f "$RUNNER_TEMP/release.jks"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/memexhub-android-${{ steps.version.outputs.name }}.apk"
      - if: github.event_name == 'push' && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memexhub-android-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
