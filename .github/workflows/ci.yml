name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: no known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: core must not import node built-ins (runtime portability)
        run: |
          if [ -d src ] && grep -rnE "from \"node:|require\(\"node:" src/core src/modules src/auth src/http src/admin 2>/dev/null; then
            echo "src/core, src/modules, src/auth and src/http must use src/platform instead of node: imports"; exit 1; fi
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
